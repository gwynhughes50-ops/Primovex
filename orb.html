<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primovex orb</title>
  </head>
  <body>
    <main id="orb" class="stage" role="button" tabindex="0" aria-label="Primovex Orb. System steady. Double-click to open Primovex." title="Primovex. Double-click to open.">

        <span class="pvx-orb-ring"></span>
        <span class="pvx-orb-core"></span>
        <span class="pvx-orb-light"></span>

      <span class="sr-only" id="status" role="status" aria-live="polite"></span>
    </main>
    <script type="module" src="/src/orb-window/orb.js"></script>
