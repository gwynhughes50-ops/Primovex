[package]
name = "primovex"
version = "0.15.41"
description = "Primovex AI Practice Intelligence"
authors = ["Primovex"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "primovex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# Local-network HTTP client for reading practice-owned WiFi sensors (e.g. a
# mains-powered Shelly thermometer) directly on the practice's own LAN — see
# fetch_local_device_reading in lib.rs. Desktop-only: this is meant to run
# from a PC sitting on the same network as the hardware, not from a phone.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.2"
